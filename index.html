<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SpendWise</title>
  <meta name="description" content="Personal and work spend tracker — spending, savings, investments and net worth in one place.">
  <meta name="theme-color" content="#6C5CE7">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0%25' stop-color='%236C5CE7'/><stop offset='100%25' stop-color='%23a29bfe'/></linearGradient></defs><rect width='32' height='32' rx='10' fill='url(%23g)'/><path d='M9 21l5-6 4 3 5-7' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;550;600;650;700;750;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <aside class="sidebar">
    <a class="brand" href="#/dashboard">
      <div class="brand-logo">
        <svg viewBox="0 0 32 32" width="32" height="32" aria-hidden="true"><defs><linearGradient id="bl" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="var(--grad-1)"/><stop offset="100%" stop-color="var(--grad-2)"/></linearGradient></defs><rect width="32" height="32" rx="10" fill="url(#bl)"/><path d="M9 21l5-6 4 3 5-7" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <span>SpendWise</span>
    </a>
    <nav id="nav" aria-label="Main"></nav>
    <div class="side-foot">
      <button class="btn ghost sm" onclick="App.toggleTheme()" aria-label="Toggle dark mode">◐ Theme</button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div id="filters" class="filters"></div>
      <div class="top-actions">
        <span id="cloud-pill"></span>
        <button class="btn icon-only" data-voice title="Add by voice (V)" aria-label="Add by voice">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>
        </button>
        <button class="btn primary" data-add title="Add (N)">＋ <span class="hide-sm">Add</span></button>
      </div>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>

  <button class="fab" data-voice aria-label="Add by voice">
    <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>
  </button>

  <div id="modal-root"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="tooltip" class="tooltip" hidden></div>

  <script src="js/config.js"></script>
  <script src="js/util.js"></script>
  <script src="js/store.js"></script>
  <script src="js/nlp.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/bills.js"></script>
  <script src="js/health.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/capture.js"></script>
  <script src="js/views.js"></script>
  <script src="js/views2.js"></script>
  <script src="js/views3.js"></script>
  <script src="js/review.js"></script>
  <script src="js/sample.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
